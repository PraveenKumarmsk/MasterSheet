<style>
:root, .theme-dark {
  --bg:#0B1220; --side:#111C30; --card:#131F36; --card2:#182742; --border:#1F2D48;
  --text:#F8FAFC; --muted:#94A3B8; --accent:#6366F1; --accent-soft:rgba(99,102,241,.16);
  --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444; --shadow:0 8px 24px rgba(0,0,0,.28);
}
.theme-light {
  --bg:#F1F5F9; --side:#FFFFFF; --card:#FFFFFF; --card2:#F8FAFC; --border:#E2E8F0;
  --text:#0F172A; --muted:#64748B; --accent:#6366F1; --accent-soft:rgba(99,102,241,.10);
  --ok:#16A34A; --warn:#D97706; --bad:#DC2626; --shadow:0 6px 18px rgba(15,23,42,.08);
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
  font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
body.modal-open { overflow:hidden; }
a { color:inherit; text-decoration:none; }
h1,h2,h3,h4 { margin:0; font-weight:650; letter-spacing:-.01em; }
.ic { width:16px; height:16px; vertical-align:-3px; }
svg.lucide { width:18px; height:18px; flex:none; }
.muted, .muted-s { color:var(--muted); }
.muted-s { font-size:12px; }
.muted-p { color:var(--muted); margin:0 0 14px; }
.hide-m { }

/* layout */
.app { display:flex; min-height:100vh; }
.sidebar { width:240px; flex:none; background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; transition:width .2s ease; overflow:hidden; }
.sidebar.collapsed { width:68px; }
.brand { display:flex; align-items:center; gap:10px; padding:18px 16px; font-weight:700; font-size:16px; white-space:nowrap; }
.brand-logo { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#6366F1,#8B5CF6); display:grid; place-items:center; color:#fff; flex:none; }
.nav { padding:6px 10px; display:flex; flex-direction:column; gap:2px; flex:1; }
.nav a { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:var(--muted); white-space:nowrap; transition:.15s; }
.nav a:hover { background:var(--accent-soft); color:var(--text); }
.nav a.active { background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(99,102,241,.35); }
.sidebar.collapsed .nav a span, .sidebar.collapsed .brand-name, .sidebar.collapsed .side-foot { display:none; }
.side-foot { padding:14px 16px; border-top:1px solid var(--border); }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(10px); position:sticky; top:0; z-index:30; }
.content { padding:22px; max-width:1500px; width:100%; margin:0 auto; padding-bottom:40px; }
.page[hidden] { display:none; }

/* topbar bits */
.gsearch { position:relative; flex:1; max-width:520px; display:flex; align-items:center; }
.gsearch > svg { position:absolute; left:12px; color:var(--muted); width:16px; height:16px; }
.gsearch input { width:100%; padding:9px 12px 9px 36px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); }
.gsearch-res { position:absolute; top:44px; left:0; right:0; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); max-height:60vh; overflow:auto; z-index:50; }
.gsearch-res .sr { display:flex; flex-direction:column; padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--border); }
.gsearch-res .sr:hover { background:var(--accent-soft); }
.gsearch-res .sr small { color:var(--muted); }
.sync-pill { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); padding:6px 10px; border:1px solid var(--border); border-radius:999px; white-space:nowrap; background:var(--card); }
.sync-pill .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; }
.sync-pill.err .dot { background:var(--bad); }
.sync-pill.busy .dot { background:var(--warn); }
.icon-btn { background:transparent; border:1px solid transparent; color:var(--muted); width:36px; height:36px; border-radius:10px; display:grid; place-items:center; cursor:pointer; position:relative; flex:none; }
.icon-btn:hover { background:var(--accent-soft); color:var(--text); }
.icon-btn.sm { width:30px; height:30px; }
.icon-btn.on { color:var(--warn); }
.badge-n { position:absolute; top:-2px; right:-2px; background:var(--bad); color:#fff; border-radius:999px; font-size:10px; min-width:17px; height:17px; display:grid; place-items:center; padding:0 4px; }
.avatar { width:34px; height:34px; border-radius:50%; border:0; background:linear-gradient(135deg,#6366F1,#EC4899); color:#fff; font-weight:700; cursor:pointer; flex:none; }

/* buttons & inputs */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--card2); color:var(--text); cursor:pointer; font:inherit; font-weight:600; transition:.15s; white-space:nowrap; }
.btn:hover { border-color:var(--accent); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover { filter:brightness(1.1); }
.btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
.btn.ghost { background:transparent; }
.btn.sm { padding:6px 10px; font-size:13px; }
.inp, select.inp, textarea.inp { width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font:inherit; min-width:0; }
.inp:focus, .gsearch input:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }

.chk { display:flex; align-items:center; gap:8px; cursor:pointer; }
.chk input { width:16px; height:16px; accent-color:var(--accent); }
.switch { position:relative; width:42px; height:24px; flex:none; }
.switch input { opacity:0; width:0; height:0; }
.switch span { position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:.2s; }
.switch span:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
.switch input:checked + span { background:var(--accent); }
.switch input:checked + span:before { transform:translateX(18px); }

/* cards & headings */
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; min-width:0; }
.card h3 { font-size:15px; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
.page-h { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.page-h h1 { font-size:22px; }
.page-h p { margin:2px 0 0; color:var(--muted); }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.toolbar .inp { width:auto; flex:1 1 150px; max-width:240px; }
.toolbar .inp.grow { flex:2 1 200px; max-width:340px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:14px; }
.grid3 { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr)); gap:14px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px; }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; cursor:pointer; transition:.15s; min-width:0; }
.kpi:hover { transform:translateY(-2px); border-color:var(--accent); }
.kpi .k-ic { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); margin-bottom:8px; }
.kpi.ok .k-ic { background:rgba(34,197,94,.14); color:var(--ok); }
.kpi.warn .k-ic { background:rgba(245,158,11,.16); color:var(--warn); }
.kpi.bad .k-ic { background:rgba(239,68,68,.14); color:var(--bad); }
.kpi b { display:block; font-size:24px; line-height:1.1; }
.kpi span { color:var(--muted); font-size:12px; }
.section-gap { display:grid; gap:14px; margin-bottom:14px; }
.alert { padding:11px 14px; border-radius:12px; border:1px solid var(--border); display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.alert.warn { background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.4); }
.alert.info { background:var(--accent-soft); border-color:rgba(99,102,241,.4); }

/* lists */
ul.li { list-style:none; margin:0; padding:0; }
ul.li li { display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); cursor:pointer; min-width:0; }

ul.li li:hover { background:var(--accent-soft); }
ul.li .t { flex:1; min-width:0; }

ul.li .t small { color:var(--muted); }
.empty-sm { color:var(--muted); padding:14px 4px; text-align:center; }
.empty { text-align:center; padding:44px 16px; color:var(--muted); border:1px dashed var(--border); border-radius:14px; }
.empty h4 { color:var(--text); margin-bottom:6px; font-size:16px; }
.empty .btn { margin-top:12px; }

/* badges */
.bd { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
.bd.ok { background:rgba(34,197,94,.14); color:var(--ok); }
.bd.warn { background:rgba(245,158,11,.16); color:var(--warn); }
.bd.bad { background:rgba(239,68,68,.14); color:var(--bad); }
.bd.mut { background:rgba(148,163,184,.16); color:var(--muted); }

/* tables */
.tbl-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:var(--card); }
table.rt { width:100%; border-collapse:collapse; }
table.rt th { text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--card2); }
table.rt td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }

table.rt tbody tr:hover { background:var(--accent-soft); }
table.rt .num { text-align:right; }
table.rt .ck { width:34px; }
table.rt .acts { white-space:nowrap; text-align:right; }
.pager { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; flex-wrap:wrap; color:var(--muted); }
.pager .row .btn[disabled] { opacity:.4; }

/* sheet cards */
.sheet-card { display:flex; flex-direction:column; gap:8px; }
.sheet-card .sc-top { display:flex; align-items:flex-start; gap:10px; }
.sheet-card .sc-ic { width:38px; height:38px; border-radius:10px; background:rgba(34,197,94,.14); color:var(--ok); display:grid; place-items:center; flex:none; }
.sheet-card .sc-t { flex:1; min-width:0; }
.sheet-card .sc-t b { display:block; overflow-wrap:anywhere; }
.sheet-card .sc-t small { color:var(--muted); }
.sheet-card p { margin:0; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
.sheet-card .sc-act { display:flex; gap:4px; flex-wrap:wrap; margin-top:auto; padding-top:6px; border-top:1px solid var(--border); }
.list-view { grid-template-columns:1fr; }
.list-view .sheet-card { flex-direction:row; align-items:center; flex-wrap:wrap; }
.list-view .sheet-card .sc-top { flex:2 1 260px; }
.list-view .sheet-card p { flex:2 1 200px; }
.list-view .sheet-card .sc-act { border:0; padding:0; margin:0; }
.tag { font-size:11px; color:var(--muted); background:var(--card2); border:1px solid var(--border); padding:1px 7px; border-radius:999px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--card); }
.seg button { border:0; background:transparent; color:var(--muted); padding:7px 12px; cursor:pointer; font:inherit; font-weight:600; display:flex; align-items:center; gap:6px; white-space:nowrap; }
.seg button.on { background:var(--accent); color:#fff; }
.seg button .cnt { font-size:11px; opacity:.85; }
.tabs-scroll { overflow-x:auto; max-width:100%; }

/* tasks */
.task-row { display:flex; align-items:center; gap:12px; padding:11px 12px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.task-row:last-child { border-bottom:0; }
.task-row .t { flex:1 1 220px; min-width:0; }
.task-row .t b { overflow-wrap:anywhere; }
.task-row.done .t b { text-decoration:line-through; color:var(--muted); }
.task-row small { color:var(--muted); }
.late { color:var(--bad) !important; font-weight:600; }
.kanban { display:grid; grid-template-columns:repeat(4,minmax(220px,1fr)); gap:12px; overflow-x:auto; padding-bottom:6px; }
.kcol { background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:10px; min-height:140px; }
.kcol.over { outline:2px dashed var(--accent); }
.kcol h4 { font-size:13px; display:flex; justify-content:space-between; margin:2px 4px 10px; color:var(--muted); }
.kcard { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; cursor:grab; display:flex; flex-direction:column; gap:6px; }
.kcard b { overflow-wrap:anywhere; }
.kcard select { padding:5px 8px; font-size:12px; }

/* notes */
.note-card { display:flex; flex-direction:column; gap:8px; position:relative; }
.note-card.pinned { border-color:var(--warn); }
.note-card .nt { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--muted); max-height:160px; overflow:hidden; }
.note-card .na { display:flex; gap:2px; margin-top:auto; border-top:1px solid var(--border); padding-top:6px; flex-wrap:wrap; }

/* charts */
.chart-card { display:flex; flex-direction:column; }
.chart-box { position:relative; height:260px; }
.chart-box canvas { max-width:100%; }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:14px; }
.stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.stat b { display:block; font-size:20px; }
.stat span { color:var(--muted); font-size:12px; }

/* forms / modal */
.modal-back { position:fixed; inset:0; background:rgba(2,6,23,.62); display:flex; align-items:center; justify-content:center; padding:16px; z-index:100; animation:fade .15s; }
.modal { background:var(--card); border:1px solid var(--border); border-radius:16px; width:100%; max-width:520px; max-height:92vh; display:flex; flex-direction:column; box-shadow:var(--shadow); }
.modal.wide { max-width:860px; }
.modal-h { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); }
.modal-b { padding:16px; overflow:auto; }
.modal-f { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap; }
.fgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.fld { display:flex; flex-direction:column; gap:5px; min-width:0; }
.fld.full { grid-column:1 / -1; }
.fld label { font-size:12px; color:var(--muted); font-weight:600; }
.req { color:var(--bad); }
.ferr { color:var(--bad); min-height:18px; margin-top:10px; font-size:13px; }
.set-row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.set-row:last-child { border-bottom:0; }
.set-row > div:first-child { flex:1 1 240px; min-width:0; }
.set-row .inp { max-width:300px; }
pre.json { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:12px; max-height:240px; overflow:auto; margin:6px 0 0; }
details.audit { border-bottom:1px solid var(--border); padding:10px 4px; }
details.audit summary { cursor:pointer; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

/* toasts, skeleton, fab, bottom nav */
#toasts { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:200; max-width:min(380px,calc(100vw - 32px)); }
.toast { background:var(--card2); color:var(--text); border:1px solid var(--border); border-left:4px solid var(--accent); padding:11px 14px; border-radius:10px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:.25s; overflow-wrap:anywhere; }
.toast.show { opacity:1; transform:none; }
.toast.success { border-left-color:var(--ok); }
.toast.error { border-left-color:var(--bad); }
.skel { background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%); background-size:200% 100%; animation:sh 1.2s infinite; border-radius:12px; min-height:90px; }
.skel-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px; }
@keyframes sh { to { background-position:-200% 0; } }
@keyframes fade { from { opacity:0; } }
.fab { display:none; position:fixed; right:16px; bottom:76px; width:54px; height:54px; border-radius:50%; border:0; background:var(--accent); color:#fff; box-shadow:0 8px 20px rgba(99,102,241,.5); z-index:60; cursor:pointer; place-items:center; }
.bottomnav { display:none; }

/* responsive */
@media (max-width:900px) {
  .sidebar { display:none; }
  .bottomnav { display:flex; position:fixed; left:0; right:0; bottom:0; background:var(--side); border-top:1px solid var(--border); z-index:70; padding:4px 4px calc(4px + env(safe-area-inset-bottom)); }
  .bottomnav a { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; color:var(--muted); font-size:11px; border-radius:10px; min-width:0; }
  .bottomnav a.active { color:var(--accent); background:var(--accent-soft); }
  .fab { display:grid; }
  .content { padding:14px 12px 100px; }
  .topbar { padding:10px 12px; gap:6px; }
  .hide-m, #syncText { display:none; }
  .sync-pill { padding:6px; }
  .fgrid { grid-template-columns:1fr; }
  .kanban { grid-template-columns:repeat(4,78vw); }
  .toolbar .inp, .toolbar .inp.grow { max-width:none; flex:1 1 100%; }
  [data-act="toggle-side"] { display:none; }
}
@media (max-width:720px) {
  table.rt.cards thead { display:none; }
  table.rt.cards, table.rt.cards tbody, table.rt.cards tr, table.rt.cards td { display:block; width:100%; }
  table.rt.cards tr { border-bottom:1px solid var(--border); padding:10px 12px; }
  table.rt.cards td { border:0; padding:3px 0; display:flex; justify-content:space-between; gap:10px; text-align:right; }
  table.rt.cards td::before { content:attr(data-label); color:var(--muted); font-size:12px; text-align:left; }
  table.rt.cards td[data-label=""]::before, table.rt.cards td.acts::before { content:none; }
  table.rt.cards td.ck { width:auto; }
  table.rt.cards td.acts { justify-content:flex-end; }
  .tbl-wrap { overflow:visible; border:0; background:transparent; }
  table.rt.cards tr { background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; }
}
@media (max-width:360px) {
  .kpis { grid-template-columns:1fr 1fr; gap:8px; }
  .kpi { padding:10px; } .kpi b { font-size:20px; }
  .page-h h1 { font-size:19px; }
  .modal-b { padding:12px; }
}
</style>
