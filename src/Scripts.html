<script>
(function () {
'use strict';

/* ===================== state & helpers ===================== */
const S = {
  boot: null, page: 'dashboard', cats: [], charts: {}, dashDays: 30, dash: null, poll: null, lastOk: 0, refreshing: false,
  lib: { all: [], q: '', cat: '', sort: 'name', view: 'grid' },
  data: { q: '', category: '', status: '', from: '', to: '', sort: 'created:desc', page: 1, sel: new Set(), byId: {}, pageIds: [] },
  an: { range: '30d', from: '', to: '', category: '', status: '', last: null },
  tasks: { view: 'all', mode: 'list', q: '', priority: '', category: '', byId: {}, counts: null },
  nr: 'notes', notes: { q: '', category: '', archived: false, byId: {}, counts: null }, rem: { view: 'upcoming', q: '', byId: {}, counts: null },
  admin: { tab: 'overview', pages: {}, q: {}, sel: {}, audit: { q: '', module: '', page: 1 } }
};
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const PALETTE = ['#6366F1', '#22C55E', '#F59E0B', '#EF4444', '#06B6D4', '#A855F7', '#EC4899', '#84CC16', '#F97316', '#14B8A6'];
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
const ic = (n, c) => '<i data-lucide="' + n + '" class="ic ' + (c || '') + '"></i>';
let icT;
function icons() { clearTimeout(icT); icT = setTimeout(() => { if (window.lucide) { try { lucide.createIcons(); } catch (e) { /* ignore */ } } }, 25); }
function debounce(fn, ms) { let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; }
function fmtD(s) { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p.length < 3 ? esc(s) : p[2] + ' ' + MON[+p[1] - 1] + ' ' + p[0]; }
function fmtDT(s) { if (!s) return '—'; return fmtD(s) + (String(s).length > 10 ? ', ' + String(s).slice(11, 16) : ''); }
function fmtNum(n) { return Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 }); }
function toLocalTime() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

function api(action, payload) {
  return new Promise((res, rej) => {
    google.script.run
      .withSuccessHandler(r => { if (r && r.ok) { markOk(); res(r.data); } else { rej(new Error((r && r.error) || 'Unknown error')); } })
      .withFailureHandler(e => rej(new Error('Connection problem: ' + ((e && e.message) || e) + '. Please retry.')))
      .api(action, payload || {});
  });
}
function markOk() { S.lastOk = Date.now(); setSync('ok'); }
function setSync(state) {
  const p = $('#syncPill'); if (!p) return;
  p.classList.toggle('err', state === 'err'); p.classList.toggle('busy', state === 'busy');
  const txt = state === 'err' ? 'Offline – will retry' : state === 'busy' ? 'Refreshing…' : 'Synced ' + toLocalTime();
  $('#syncText').textContent = txt; const ss = $('#sideSync'); if (ss) ss.textContent = txt;
  const sec = S.boot ? Number(S.boot.settings.POLL_INTERVAL_SEC) : 0;
  p.title = sec > 0 ? 'Auto-refresh about every ' + Math.max(15, sec) + 's (periodic, not instant). Edits made directly in the Google Sheet appear on the next refresh.' : 'Auto-refresh is off. Use the refresh buttons.';
}

function toast(msg, type) {
  const el = document.createElement('div'); el.className = 'toast ' + (type || 'info'); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, type === 'error' ? 7000 : 3200);
}
function skel(n) { let h = '<div class="skel-grid">'; for (let i = 0; i < (n || 6); i++) h += '<div class="skel"></div>'; return h + '</div>'; }
function empty(title, text, btn) { return '<div class="empty"><h4>' + esc(title) + '</h4><div>' + esc(text) + '</div>' + (btn || '') + '</div>'; }
function opts(list, cur, all) { return (all !== undefined ? '<option value="">' + esc(all) + '</option>' : '') + list.map(o => '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join(''); }
function setCats(list) { S.cats = list || S.cats; $('#dl-cat').innerHTML = S.cats.map(c => '<option value="' + esc(c) + '">').join(''); }
function badge(t, k) { return '<span class="bd ' + (k || '') + '">' + esc(t) + '</span>'; }
function priBadge(p) { return badge(p, p === 'High' ? 'bad' : p === 'Low' ? 'mut' : 'warn'); }
function statusBadge(s) { const m = { Active: 'ok', Pending: 'warn', Completed: 'ok', 'In Progress': '', 'To Do': 'mut', 'On Hold': 'warn', Archived: 'mut', Sent: 'ok' }; return badge(s, m[s] === undefined ? '' : m[s]); }
function copyText(t) {
  const done = () => toast('Copied to clipboard', 'success');
  const fb = () => { const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed – select and copy manually.', 'error'); } a.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb();
}
function download(name, text, mime) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ===================== modal / forms ===================== */
function openModal(o) {
  const wrap = document.createElement('div'); wrap.className = 'modal-back';
  wrap.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true"><div class="modal-h"><h3>' + esc(o.title) + '</h3><button class="icon-btn" data-close aria-label="Close">' + ic('x') + '</button></div><div class="modal-b">' + o.html + '</div></div>';
  $('#modal-root').appendChild(wrap); document.body.classList.add('modal-open');
  const close = () => { if (!wrap.isConnected) return; wrap.remove(); if (!$('.modal-back')) document.body.classList.remove('modal-open'); if (o.onClose) o.onClose(); };
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  $('[data-close]', wrap).onclick = close;
  icons(); if (o.onMount) o.onMount(wrap, close);
  return { el: wrap, close };
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const m = $$('.modal-back'); if (m.length) { const last = m[m.length - 1]; const b = $('[data-close]', last); if (b) b.click(); } closeSearch(); }
});

function confirmBox(title, msg, o) {
  o = o || {};
  return new Promise(res => {
    let ans = false;
    openModal({
      title, onClose: () => res(ans),
      html: '<p class="muted-p">' + esc(msg) + '</p>' + (o.typed ? '<input class="inp" id="cf-t" placeholder="Type ' + esc(o.typed) + ' to confirm" autocomplete="off">' : '') +
        '<div class="modal-f"><button class="btn ghost" data-no>Cancel</button><button class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-yes' + (o.typed ? ' disabled' : '') + '>' + esc(o.ok || 'Confirm') + '</button></div>',
      onMount: (el, close) => {
        const yes = $('[data-yes]', el);
        if (o.typed) $('#cf-t', el).addEventListener('input', e => { yes.disabled = e.target.value.trim() !== o.typed; });
        $('[data-no]', el).onclick = close;
        yes.onclick = () => { ans = o.typed ? $('#cf-t', el).value.trim() : true; close(); };
      }
    });
  });
}

function fieldHtml(f, v) {
  const id = 'f-' + f.name, val = v == null ? '' : v;
  let inp;
  if (f.type === 'textarea') inp = '<textarea class="inp" id="' + id + '" name="' + f.name + '" rows="' + (f.rows || 3) + '" maxlength="' + (f.max || 2000) + '" placeholder="' + esc(f.ph || '') + '">' + esc(val) + '</textarea>';
  else if (f.type === 'select') inp = '<select class="inp" id="' + id + '" name="' + f.name + '">' + f.options.map(o => '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
  else if (f.type === 'checkbox') inp = '<label class="chk"><input type="checkbox" name="' + f.name + '"' + (val ? ' checked' : '') + '> ' + esc(f.text || '') + '</label>';
  else if (f.type === 'cat') inp = '<input class="inp" id="' + id + '" name="' + f.name + '" list="dl-cat" maxlength="60" value="' + esc(val) + '" placeholder="Pick or type a new category">';
  else inp = '<input class="inp" id="' + id + '" name="' + f.name + '" type="' + (f.type || 'text') + '"' + (f.step ? ' step="' + f.step + '"' : '') + ' maxlength="' + (f.max || 200) + '" value="' + esc(val) + '" placeholder="' + esc(f.ph || '') + '"' + (f.type === 'number' ? ' inputmode="decimal"' : '') + '>';
  return '<div class="fld' + (f.full ? ' full' : '') + '">' + (f.label ? '<label for="' + id + '">' + esc(f.label) + (f.req ? ' <b class="req">*</b>' : '') + '</label>' : '') + inp + '</div>';
}
function openForm(o) {
  return openModal({
    title: o.title, wide: o.wide,
    html: (o.intro ? '<p class="muted-p">' + o.intro + '</p>' : '') + '<form id="mf" novalidate><div class="fgrid">' + o.fields.map(f => fieldHtml(f, (o.values || {})[f.name])).join('') +
      '</div><div class="ferr" id="mf-err" role="alert"></div><div class="modal-f"><button type="button" class="btn ghost" data-cancel>Cancel</button><button type="submit" class="btn primary" id="mf-ok">' + esc(o.submit || 'Save') + '</button></div></form>',
    onMount: (el, close) => {
      const form = $('#mf', el); let rid = uid();
      $('[data-cancel]', el).onclick = close;
      form.onsubmit = async e => {
        e.preventDefault();
        const vals = {};
        o.fields.forEach(f => { const n = form.elements[f.name]; vals[f.name] = f.type === 'checkbox' ? n.checked : n.value; });
        for (const f of o.fields) { if (f.req && !String(vals[f.name]).trim()) { $('#mf-err', el).textContent = (f.label || f.name) + ' is required.'; return; } }
        vals.requestId = rid;
        const btn = $('#mf-ok', el); btn.disabled = true; btn.textContent = 'Saving…'; $('#mf-err', el).textContent = '';
        try { await o.onSubmit(vals); close(); }
        catch (err) { $('#mf-err', el).textContent = err.message; rid = uid(); btn.disabled = false; btn.textContent = o.submit || 'Save'; }
      };
      const first = form.querySelector('input:not([type=checkbox]),textarea,select'); if (first) first.focus();
    }
  });
}

/* ===================== events (delegated) ===================== */
const ACT = {}, CHG = {}, INP = {};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) { if (!e.target.closest('.gsearch')) closeSearch(); return; } const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); } });
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); });
document.addEventListener('input', e => { const t = e.target.closest('[data-inp]'); if (t && INP[t.dataset.inp]) INP[t.dataset.inp](t, e); });
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  if (f.dataset.form.indexOf('settings-') === 0) saveSettingsForm(f);
});

/* ===================== router ===================== */
const LOADERS = {};
function load(page, silent) {
  const f = LOADERS[page];
  if (!f) return Promise.resolve();
  if (silent) setSync('busy');
  return f(!!silent).catch(e => { if (!silent) toast(e.message, 'error'); setSync('err'); });
}
function go(page) {
  S.page = page;
  $$('.page').forEach(p => { p.hidden = p.id !== 'page-' + page; });
  $$('[data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  try { localStorage.setItem('ms-page', page); } catch (e) { /* ignore */ }
  window.scrollTo(0, 0);
  return load(page, false);
}
function afterWrite() { refreshBell(); return load(S.page, true); }
ACT.nav = t => { go(t.dataset.page); };
ACT['toggle-side'] = () => { $('#sidebar').classList.toggle('collapsed'); };
ACT.more = () => {
  const m = openModal({ title: 'More', html: '<div class="grid3">' + [['analytics', 'bar-chart-3', 'Analytics'], ['notes', 'sticky-note', 'Notes & Reminders'], ['admin', 'shield-check', 'Admin Panel'], ['settings', 'settings', 'Settings']].map(x => '<button class="btn" data-go="' + x[0] + '">' + ic(x[1]) + ' ' + x[2] + '</button>').join('') + '</div>',
    onMount: (el, close) => { $$('[data-go]', el).forEach(b => { b.onclick = () => { close(); go(b.dataset.go); }; }); } });
};

/* ===================== theme / topbar ===================== */
function applyTheme(t) {
  document.documentElement.className = 'theme-' + t;
  try { localStorage.setItem('ms-theme', t); } catch (e) { /* ignore */ }
  const b = $('[data-act="theme"]'); if (b) { b.innerHTML = ic(t === 'dark' ? 'sun' : 'moon'); icons(); }
}
ACT.theme = () => { applyTheme(document.documentElement.classList.contains('theme-dark') ? 'light' : 'dark'); if (S.page !== 'settings') load(S.page, true); };
ACT.profile = () => {
  openModal({ title: 'Your account', html: '<p><b>' + esc(S.boot.user) + '</b></p><p class="muted-p">Access is restricted to this Google account. Every request is verified on the server.</p><p class="muted-s">Time zone: ' + esc(S.boot.tz) + '</p>' +
    '<div class="modal-f"><a class="btn" href="' + esc(S.boot.spreadsheetUrl) + '" target="_blank" rel="noopener">' + ic('external-link') + ' Open database spreadsheet</a></div>' });
};
async function refreshBell() {
  try {
    const n = await api('notifications'); S.boot.today = n.today; S.notif = n;
    const tot = n.overdueTasks + n.overdueReminders, b = $('#bellBadge'); b.hidden = tot === 0; b.textContent = tot > 99 ? '99+' : tot;
  } catch (e) { /* silent */ }
}
ACT.bell = async () => {
  await refreshBell(); const n = S.notif || { tasks: [], reminders: [] };
  const li = (type, id, title, sub) => '<li data-act="open-item" data-type="' + type + '" data-id="' + esc(id) + '"><div class="t"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></div></li>';
  const body = (n.tasks.length ? '<h4 style="margin:4px 0 6px">Overdue tasks (' + n.overdueTasks + ')</h4><ul class="li">' + n.tasks.map(t => li('task', t.id, t.taskName, 'Due ' + fmtD(t.dueDate))).join('') + '</ul>' : '') +
    (n.reminders.length ? '<h4 style="margin:14px 0 6px">Overdue reminders (' + n.overdueReminders + ')</h4><ul class="li">' + n.reminders.map(r => li('reminder', r.id, r.reminderTitle, fmtD(r.reminderDate) + ' ' + r.reminderTime)).join('') + '</ul>' : '');
  openModal({ title: 'Notifications', html: body || '<div class="empty-sm">You are all caught up. Nothing is overdue.</div>' });
};
ACT['quick-add'] = () => {
  const items = [['data', 'database', 'New Data Entry'], ['sheet', 'file-spreadsheet', 'New Sheet Link'], ['task', 'check-square', 'New Task'], ['note', 'sticky-note', 'New Note'], ['reminder', 'clock', 'New Reminder']];
  openModal({ title: 'Quick Add', html: '<div class="grid3">' + items.map(x => '<button class="btn" data-qa="' + x[0] + '">' + ic(x[1]) + ' ' + x[2] + '</button>').join('') + '</div>',
    onMount: (el, close) => { $$('[data-qa]', el).forEach(b => { b.onclick = () => { close(); quickAction(b.dataset.qa); }; }); } });
};
function quickAction(k) { ({ data: addRecord, sheet: addSheet, task: addTask, note: addNote, reminder: addReminder })[k](); }

/* global search */
function closeSearch() { const r = $('#gsearch-res'); if (r) r.hidden = true; }
INP.gsearch = debounce(async el => {
  const q = el.value.trim(), box = $('#gsearch-res');
  if (q.length < 2) { box.hidden = true; return; }
  try {
    const r = await api('search', { q });
    box.innerHTML = r.results.length ? r.results.map(x => '<div class="sr" data-act="open-item" data-type="' + x.type + '" data-id="' + esc(x.id) + '"><b>' + esc(x.title) + '</b><small>' + esc(x.sub) + '</small></div>').join('') : '<div class="empty-sm">No results for "' + esc(q) + '"</div>';
    box.hidden = false;
  } catch (e) { toast(e.message, 'error'); }
}, 350);
ACT['open-item'] = async t => {
  const type = t.dataset.type, id = t.dataset.id; closeSearch();
  $$('.modal-back').forEach(m => { const b = $('[data-close]', m); if (b) b.click(); });
  try {
    const it = await api('item', { type, id });
    if (type === 'sheet') { await go('library'); editSheet(it); }
    else if (type === 'data') { await go('data'); editRecord(it); }
    else if (type === 'task') { await go('tasks'); editTask(it); }
    else if (type === 'note') { S.nr = 'notes'; await go('notes'); editNote(it); }
    else if (type === 'reminder') { S.nr = 'reminders'; await go('notes'); editReminder(it); }
  } catch (e) { toast(e.message, 'error'); }
};

/* ===================== charts ===================== */
const bgPlugin = { id: 'bg', beforeDraw(c) { const x = c.canvas.getContext('2d'); x.save(); x.globalCompositeOperation = 'destination-over'; x.fillStyle = getComputedStyle(document.body).getPropertyValue('--card').trim() || '#fff'; x.fillRect(0, 0, c.width, c.height); x.restore(); } };
function killChart(id) { if (S.charts[id]) { S.charts[id].destroy(); delete S.charts[id]; } }
function mkChart(id, type, labels, datasets, o) {
  o = o || {};
  const box = document.getElementById('box-' + id); if (!box) return;
  const total = datasets.reduce((a, d) => a + d.data.reduce((x, y) => x + y, 0), 0);
  killChart(id);
  if (!window.Chart) { box.innerHTML = '<div class="empty-sm">Chart library could not load. Check your internet connection.</div>'; return; }
  if (!total) { box.innerHTML = '<div class="empty-sm" style="padding-top:90px">No data in this range yet.</div>'; return; }
  box.innerHTML = '<canvas id="' + id + '"></canvas>';
  const css = getComputedStyle(document.documentElement), muted = css.getPropertyValue('--muted').trim(), grid = css.getPropertyValue('--border').trim();
  const round = type === 'doughnut' || type === 'pie';
  S.charts[id] = new Chart(document.getElementById(id), {
    type, data: { labels, datasets }, plugins: [bgPlugin],
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: o.legend !== false, position: round ? 'bottom' : 'top', labels: { color: muted, boxWidth: 12 } }, tooltip: { enabled: true } },
      scales: round ? {} : { x: { ticks: { color: muted, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: muted, precision: 0 }, grid: { color: grid } } }
    }
  });
}
function ds(label, data, i, fill) { const c = PALETTE[i % PALETTE.length]; return { label, data, borderColor: c, backgroundColor: fill ? c + '33' : c, fill: !!fill, tension: .3, borderRadius: 6, pointRadius: 2 }; }
function pie(label, data) { return [{ label, data, backgroundColor: data.map((_, i) => PALETTE[i % PALETTE.length]), borderWidth: 0 }]; }
function shortDay(s) { return s.slice(8) + ' ' + MON[+s.slice(5, 7) - 1]; }
ACT.png = t => { const c = S.charts[t.dataset.id]; if (!c) { toast('Nothing to export for this chart.', 'error'); return; } const a = document.createElement('a'); a.href = c.toBase64Image('image/png', 1); a.download = t.dataset.id + '.png'; a.click(); };

/* ===================== DASHBOARD ===================== */
const WIDGETS = [['kpis', 'KPI cards'], ['quick', 'Quick actions'], ['favorites', 'Favorite sheets'], ['entries', 'Recent data entries'], ['tasks', "Today's tasks"], ['reminders', 'Upcoming reminders'], ['notes', 'Recent notes'], ['activity', 'Latest activity'], ['charts', 'Charts']];
function widgetsOn() { return String(S.boot.settings.DASH_WIDGETS || '').split(',').map(s => s.trim()).filter(Boolean); }
LOADERS.dashboard = async function (silent, force) {
  const box = $('#page-dashboard');
  if (!silent && !box.dataset.ready) box.innerHTML = skel(8);
  const d = await api('dashboard', { days: S.dashDays, force: !!force });
  S.dash = d; S.boot.today = d.today; renderDashboard(d); box.dataset.ready = 1;
};
function liItem(type, id, title, sub, right) { return '<li data-act="open-item" data-type="' + type + '" data-id="' + esc(id) + '"><div class="t"><b>' + esc(title) + '</b><small>' + sub + '</small></div>' + (right || '') + '</li>'; }
function listOr(arr, fn, msg) { return arr.length ? '<ul class="li">' + arr.map(fn).join('') + '</ul>' : '<div class="empty-sm">' + msg + '</div>'; }
function renderDashboard(d) {
  const W = widgetsOn(), k = d.kpis; let h = '';
  h += '<div class="page-h"><div><h1>Dashboard</h1><p>' + fmtD(d.today) + ' · calculated from your Google Sheet</p></div><div class="row">' +
    '<select class="inp" data-chg="dash-days" style="width:auto" aria-label="Chart range">' + [7, 30, 90].map(n => '<option value="' + n + '"' + (n === S.dashDays ? ' selected' : '') + '>Last ' + n + ' days</option>').join('') + '</select>' +
    '<button class="btn" data-act="dash-widgets">' + ic('sliders-horizontal') + ' Customize</button><button class="btn primary" data-act="dash-refresh">' + ic('refresh-cw') + ' Refresh</button></div></div>';
  if (k.overdueTasks) h += '<div class="alert warn">' + ic('alert-triangle') + '<div style="flex:1"><b>' + k.overdueTasks + ' overdue task' + (k.overdueTasks > 1 ? 's' : '') + '</b> – ' + d.overdueTasks.slice(0, 3).map(t => esc(t.taskName)).join(', ') + (k.overdueTasks > 3 ? '…' : '') + '</div><button class="btn sm" data-act="go-overdue">View</button></div>';
  if (W.indexOf('kpis') >= 0) {
    const K = [['Total Important Sheets', k.totalSheets, 'file-spreadsheet', '', 'library'], ['Favorite Sheets', k.favoriteSheets, 'star', 'warn', 'library'], ['Total Data Records', k.totalRecords, 'database', '', 'data'], ['Records Added Today', k.recordsToday, 'plus-circle', 'ok', 'data'],
      ['Pending Tasks', k.pendingTasks, 'clock', 'warn', 'tasks'], ['Completed Tasks', k.completedTasks, 'check-circle-2', 'ok', 'tasks'], ['Overdue Tasks', k.overdueTasks, 'alert-triangle', 'bad', 'tasks'], ['Active Reminders', k.activeReminders, 'bell-ring', '', 'notes']];
    h += '<div class="kpis">' + K.map(x => '<div class="kpi ' + x[3] + '" data-act="nav" data-page="' + x[4] + '"><div class="k-ic">' + ic(x[2]) + '</div><b>' + x[1] + '</b><span>' + x[0] + '</span></div>').join('') + '</div>';
  }
  if (W.indexOf('quick') >= 0) h += '<div class="card section-gap"><h3>Quick actions</h3><div class="row">' +

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false; text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur); if (row.some(x => x !== '')) rows.push(row);
  return rows;
}
const CSV_MAP = { entrydate: 'entryDate', date: 'entryDate', category: 'category', title: 'title', name: 'title', description: 'description', value: 'valueAmount', amount: 'valueAmount', valueamount: 'valueAmount', status: 'status', priority: 'priority', remarks: 'remarks', notes: 'remarks' };

  if (e.target.id !== 'csvFile' || !e.target.files[0]) return;
  const file = e.target.files[0];
  if (file.size > 5 * 1024 * 1024) { toast('CSV is larger than 5 MB. Split the file and import in parts.', 'error'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const rows = parseCSV(String(rd.result));
    if (rows.length < 2) { toast('The CSV needs a header row and at least one data row.', 'error'); return; }
    const map = rows[0].map(h => CSV_MAP[h.toLowerCase().replace(/[^a-z]/g, '')] || null);
    if (map.indexOf('title') < 0) { toast('The CSV needs a "Title" column. Recognised columns: Entry Date, Category, Title, Description, Value, Status, Priority, Remarks.', 'error'); return; }
    const recs = rows.slice(1).map((r, i) => { const o = { _line: i + 2 }; map.forEach((k, c) => { if (k) o[k] = String(r[c] == null ? '' : r[c]).replace(/^'(?=[=+\-@])/, ''); }); if (!o.category) o.category = 'Other'; return o; });
    openModal({ title: 'Import CSV', html: '<p class="muted-p"><b>' + recs.length + '</b> row(s) found in <b>' + esc(file.name) + '</b>. Recognised columns: ' + map.filter(Boolean).map(esc).join(', ') + '. Invalid rows are skipped and reported.</p><div class="modal-f"><button class="btn ghost" data-no>Cancel</button><button class="btn primary" id="doImp">Import ' + recs.length + ' rows</button></div>',
      onMount: (el, close) => {
        $('[data-no]', el).onclick = close;
        $('#doImp', el).onclick = async () => {
          const b = $('#doImp', el); b.disabled = true; let ok = 0, fail = 0, errs = [];
          try {
            for (let i = 0; i < recs.length; i += 300) { b.textContent = 'Importing… ' + Math.min(i + 300, recs.length) + '/' + recs.length; const r = await api('data.import', { rows: recs.slice(i, i + 300) }); ok += r.imported; fail += r.failed; errs = errs.concat(r.errors); }
            close(); toast('Imported ' + ok + ' record(s)' + (fail ? ', ' + fail + ' skipped' : ''), fail ? 'info' : 'success');
            if (fail) openModal({ title: 'Rows that were skipped', html: '<ul class="li">' + errs.slice(0, 20).map(x => '<li style="cursor:default"><div class="t"><b>Line ' + x.row + '</b><small>' + esc(x.error) + '</small></div></li>').join('') + '</ul>' });
            afterWrite();
          } catch (err) { toast(err.message + ' (' + ok + ' rows were imported before the error)', 'error'); close(); afterWrite(); }
        };
      } });
  };
  rd.readAsText(file);
});

    '<div class="task-row' + (x.status !== 'Active' ? ' done' : '') + '"><div class="t"><b>' + esc(x.reminderTitle) + '</b>' + (x.description ? '<br><small>' + esc(x.description.slice(0, 100)) + '</small>' : '') + '</div><div class="chips">' + (x.overdue ? badge('Overdue', 'bad') : '') + statusBadge(x.status) + '<span class="tag">' + ic('repeat') + ' ' + esc(x.repeatRule) + '</span><span class="tag">' + ic(x.notificationChannel === 'Email' ? 'mail' : 'bell') + ' ' + esc(x.notificationChannel) + '</span></div>' +
    '<small class="' + (x.overdue ? 'late' : '') + '">' + fmtD(x.reminderDate) + ' ' + esc(x.reminderTime) + (x.lastSentAt ? '<br>Last sent ' + fmtDT(x.lastSentAt) : '') + '</small><div class="row">' +
    (x.status === 'Active' ? '<button class="icon-btn sm" title="Mark complete" data-act="r-done" data-id="' + esc(x.id) + '">' + ic('check') + '</button>' : '<button class="icon-btn sm" title="Reopen" data-act="r-reopen" data-id="' + esc(x.id) + '">' + ic('rotate-ccw') + '</button>') +
    '<button class="icon-btn sm" title="Edit" data-act="r-edit" data-id="' + esc(x.id) + '">' + ic('pencil') + '</button><button class="icon-btn sm" title="Delete" data-act="r-del" data-id="' + esc(x.id) + '">' + ic('trash-2') + '</button></div></div>').join('') + '</div>' :
    empty('No reminders here', R.view === 'upcoming' ? 'Set a reminder and it will show up here.' : 'Nothing in this list.', '<br><button class="btn primary" data-act="nr-add">' + ic('plus') + ' Set Reminder</button>');
  icons();
}
INP['r-q'] = debounce(el => { S.rem.q = el.value; load('notes', true); }, 300);
ACT['r-view'] = t => { S.rem.view = t.dataset.v; load('notes', true); };
ACT['r-edit'] = t => { const x = S.rem.byId[t.dataset.id]; if (x) editReminder(x); };
ACT['r-done'] = async t => { try { await api('reminders.complete', { id: t.dataset.id }); toast('Reminder completed', 'success'); afterWrite(); } catch (e) { toast(e.message, 'error'); } };
ACT['r-reopen'] = async t => { try { await api('reminders.reopen', { id: t.dataset.id }); toast('Reminder re-activated', 'success'); afterWrite(); } catch (e) { toast(e.message, 'error'); } };
ACT['r-del'] = async t => {

/* ===================== SETTINGS ===================== */
function setRow(d) {
  const v = S.boot.settings[d.key]; let inp;
  if (d.type === 'bool') inp = '<label class="switch"><input type="checkbox" name="' + d.key + '"' + (String(v).toUpperCase() === 'TRUE' ? ' checked' : '') + '><span></span></label>';
  else if (d.type === 'select') inp = '<select class="inp" name="' + d.key + '">' + opts(d.options, v) + '</select>';
  else if (d.type === 'number') inp = '<input class="inp" type="number" name="' + d.key + '" min="' + d.min + '" max="' + d.max + '" value="' + esc(v) + '">';
  else if (d.type === 'list') inp = '<textarea class="inp" rows="3" name="' + d.key + '">' + esc(v) + '</textarea>';
  else inp = '<input class="inp" name="' + d.key + '" value="' + esc(v) + '" maxlength="200">';
  return '<div class="set-row"><div><b>' + esc(d.label) + '</b><div class="muted-s">' + esc(d.desc) + '</div></div>' + inp + '</div>';
}
function settingsForm(group) {
  const defs = S.boot.settingDefs.filter(d => d.group === group);
  return '<form class="card" data-form="settings-' + group + '">' + defs.map(setRow).join('') + '<div class="modal-f"><button class="btn primary" type="submit">' + ic('save') + ' Save settings</button></div><div class="ferr" role="alert"></div></form>';
}
async function saveSettingsForm(f) {
  const group = f.dataset.form.slice(9), values = {};
  S.boot.settingDefs.filter(d => d.group === group).forEach(d => { const el = f.elements[d.key]; if (el) values[d.key] = d.type === 'bool' ? el.checked : el.value; });
  const btn = $('button[type=submit]', f), err = $('.ferr', f); btn.disabled = true; err.textContent = '';
  try {
    const r = await api('settings.save', { values }); S.boot.settings = r.settings; setCats(r.categories);
    applySettings(); toast('Settings saved', 'success');
  } catch (e) { err.textContent = e.message; toast(e.message, 'error'); }
  btn.disabled = false;
}
function applySettings() { $('#brandName').textContent = S.boot.settings.APP_NAME; document.title = S.boot.settings.APP_NAME; startPolling(); setSync('ok'); }
LOADERS.settings = async function () {
  const b = $('#page-settings');
  b.innerHTML = '<div class="page-h"><div><h1>Settings</h1><p>Personalise how MasterSheet looks and refreshes</p></div></div>' +
    '<div class="card" style="margin-bottom:14px"><div class="set-row"><div><b>Theme on this device</b><div class="muted-s">Light or dark. Saved in this browser.</div></div><button class="btn" data-act="theme">' + ic('sun') + ' Toggle theme</button></div>' +
    '<div class="set-row"><div><b>Dashboard widgets</b><div class="muted-s">Choose what the dashboard shows.</div></div><button class="btn" data-act="dash-widgets">' + ic('sliders-horizontal') + ' Customize</button></div>' +
    '<div class="set-row"><div><b>Synchronisation</b><div class="muted-s">The website reads your sheet periodically (default every 60 s) and immediately after each of your own changes. Edits made directly inside Google Sheets appear on the next refresh – it is not instant.</div></div><button class="btn" data-act="dash-refresh">' + ic('refresh-cw') + ' Refresh now</button></div></div>' + settingsForm('user');
  icons();
};

/* ===================== ADMIN ===================== */
const ADMIN_TABS = [['overview', 'Overview'], ['sheets', 'Manage Sheets'], ['records', 'Manage Records'], ['tasks', 'Manage Tasks'], ['notes', 'Manage Notes'], ['reminders', 'Manage Reminders'], ['automation', 'Automation Settings'], ['audit', 'Audit Logs'], ['backups', 'Backup Management'], ['system', 'System Settings']];
LOADERS.admin = async function (silent) {
  const b = $('#page-admin');
  if (!b.dataset.ready) {
    b.innerHTML = '<div class="page-h"><div><h1>Admin Panel</h1><p>Private control centre – owner only, verified on every request</p></div></div><div class="toolbar"><div class="seg tabs-scroll" id="adm-tabs">' +
      ADMIN_TABS.map(x => '<button data-act="adm-tab" data-t="' + x[0] + '">' + x[1] + '</button>').join('') + '</div></div><div id="adm-body"></div>';
    b.dataset.ready = 1;
  }
  if (!silent) await renderAdmin();
};
ACT['adm-tab'] = t => { S.admin.tab = t.dataset.t; renderAdmin(); };
async function renderAdmin() {
  const A = S.admin, body = $('#adm-body'); if (!body) return;
  $$('#adm-tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === A.tab));
  body.innerHTML = skel(3);
  try {
    if (A.tab === 'overview') await admOverview(body);
    else if (['sheets', 'records', 'tasks', 'notes', 'reminders'].indexOf(A.tab) >= 0) await admManage(body, A.tab);
    else if (A.tab === 'automation') await admAutomation(body);
    else if (A.tab === 'audit') await admAudit(body);
    else if (A.tab === 'backups') await admBackups(body);
    else if (A.tab === 'system') admSystem(body);
  } catch (e) { body.innerHTML = '<div class="alert warn">' + ic('alert-triangle') + '<div>' + esc(e.message) + '</div></div>'; }
  icons();
}
async function admOverview(body) {
  const o = await api('admin.overview');
  body.innerHTML = '<div class="stat-grid">' + Object.keys(o.counts).map(k => '<div class="stat"><b>' + o.counts[k] + '</b><span>' + k + ' rows</span></div>').join('') + '</div>' +
    '<div class="grid2"><div class="card"><h3>System status</h3><ul class="li">' +
    '<li style="cursor:default"><div class="t"><b>Owner account</b><small>' + esc(o.owner) + '</small></div></li>' +
    '<li style="cursor:default"><div class="t"><b>Automation triggers</b><small>' + (o.triggersInstalled ? 'Installed' : 'Not installed – open Automation Settings') + '</small></div>' + badge(o.triggersInstalled ? 'OK' : 'Action needed', o.triggersInstalled ? 'ok' : 'warn') + '</li>' +
    '<li style="cursor:default"><div class="t"><b>Last successful backup</b><small>' + (o.lastBackup ? fmtDT(o.lastBackup.timestamp) + ' · ' + esc(o.lastBackup.type) : 'None yet') + '</small></div></li>' +
    '<li style="cursor:default"><div class="t"><b>Errors in the last 24 h</b><small>From the automation log</small></div>' + badge(String(o.errors24h), o.errors24h ? 'bad' : 'ok') + '</li>' +
    '<li style="cursor:default"><div class="t"><b>Overdue tasks (last check)</b></div>' + badge(String(o.overdueCount), o.overdueCount ? 'warn' : 'ok') + '</li>' +
    '<li style="cursor:default"><div class="t"><b>E-mail quota left today</b></div>' + badge(o.mailQuota == null ? 'n/a' : String(o.mailQuota), '') + '</li>' +
    '<li style="cursor:default"><div class="t"><b>Time zone</b><small>' + esc(o.tz) + ' (spreadsheet setting)</small></div></li></ul>' +
    '<div class="modal-f"><a class="btn" href="' + esc(o.spreadsheetUrl) + '" target="_blank" rel="noopener">' + ic('external-link') + ' Open database spreadsheet</a></div></div>' +
    '<div class="card"><h3>Recent automation runs</h3>' + listOr(o.recentAutomation, a => '<li style="cursor:default"><div class="t"><b>' + esc(a.job) + '</b><small>' + fmtDT(a.timestamp) + ' · ' + esc(a.message) + '</small></div>' + badge(a.result, a.result === 'Error' ? 'bad' : 'ok') + '</li>', 'No automation has run yet.') + '</div></div>';
}
async function admManage(body, tab) {
  const A = S.admin, page = A.pages[tab] || 1, q = A.q[tab] || '', sel = A.sel[tab] || (A.sel[tab] = new Set());
  const r = await api('admin.list', { tab, q, page }); A.pages[tab] = r.page;
  const val = (c, x) => { const v = x[c.key]; return typeof v === 'boolean' ? (v ? 'Yes' : 'No') : esc(v === '' ? '—' : v); };
  body.innerHTML = '<div class="toolbar"><input class="inp grow" data-inp="adm-q" data-t="' + tab + '" type="search" value="' + esc(q) + '" placeholder="Search…" aria-label="Search"><button class="btn danger sm" data-act="adm-del" data-t="' + tab + '"' + (sel.size ? '' : ' hidden') + ' id="adm-del">' + ic('trash-2') + ' Delete selected (' + sel.size + ')</button></div>' +
    (r.rows.length ? '<div class="tbl-wrap"><table class="rt cards"><thead><tr><th class="ck"></th>' + r.columns.map(c => '<th>' + esc(c.label) + '</th>').join('') + '</tr></thead><tbody>' +
      r.rows.map(x => '<tr><td class="ck" data-label=""><input type="checkbox" data-chg="adm-sel" data-t="' + tab + '" value="' + esc(x.id) + '"' + (sel.has(x.id) ? ' checked' : '') + '></td>' + r.columns.map(c => '<td data-label="' + esc(c.label) + '">' + val(c, x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' + pager('adm:' + tab, r.page, r.pages, r.total, 'items') : empty('Nothing here', 'No items match.'));
}
INP['adm-q'] = debounce(el => { S.admin.q[el.dataset.t] = el.value; S.admin.pages[el.dataset.t] = 1; renderAdmin(); }, 400);
CHG['adm-sel'] = t => { const s = S.admin.sel[t.dataset.t]; if (t.checked) s.add(t.value); else s.delete(t.value); const b = $('#adm-del'); if (b) { b.hidden = s.size === 0; b.innerHTML = ic('trash-2') + ' Delete selected (' + s.size + ')'; icons(); } };
ACT['adm-del'] = async t => {
  const tab = t.dataset.t, ids = Array.from(S.admin.sel[tab] || []);
  if (!ids.length) return;
  if (!await confirmBox('Delete ' + ids.length + ' item(s)?', 'They will be removed from the sheet. A copy of each is kept in the audit log.', { danger: true, ok: 'Delete' })) return;
  try { const r = await api('admin.delete', { tab, ids, confirm: true }); S.admin.sel[tab].clear(); toast(r.deleted + ' item(s) deleted', 'success'); renderAdmin(); refreshBell(); } catch (e) { toast(e.message, 'error'); }
};
async function admAutomation(body) {
  const a = await api('admin.automation');
  body.innerHTML = '<div class="alert info">' + ic('info') + '<div>Scheduled jobs run through Google Apps Script time-driven triggers. Google may delay a run by a few minutes, so timing is approximate. Triggers must be installed once.</div></div>' +
    '<div class="grid2"><div class="card"><h3>Jobs</h3>' + a.jobs.map(j => '<div class="set-row"><div><b>' + esc(j.label) + '</b></div><label class="switch"><input type="checkbox" data-chg="job-toggle" data-k="' + j.key + '"' + (j.value ? ' checked' : '') + '><span></span></label></div>').join('') + '</div>' +
    '<div class="card"><h3>Triggers</h3>' + a.triggers.map(t => '<div class="set-row"><div><b>' + esc(t.handler) + '</b></div>' + badge(t.installed ? 'Installed' : 'Missing', t.installed ? 'ok' : 'warn') + '</div>').join('') +
    '<div class="modal-f"><button class="btn" data-act="trg-remove">Remove triggers</button><button class="btn primary" data-act="trg-install">' + ic('zap') + ' Install / reinstall triggers</button></div>' +
    '<h3 style="margin-top:18px">Run a job now</h3><div class="row">' + [['reminders', 'Reminders'], ['overdue', 'Overdue check'], ['summary', 'Refresh summary'], ['backup', 'Backup'], ['cleanup', 'Log cleanup']].map(x => '<button class="btn sm" data-act="job-run" data-j="' + x[0] + '">' + x[1] + '</button>').join('') + '</div></div></div>' +
    '<div class="card" style="margin-top:14px"><h3>Automation log</h3>' + (a.log.length ? '<div class="tbl-wrap"><table class="rt cards"><thead><tr><th>Time</th><th>Job</th><th>Result</th><th class="num">ms</th><th>Message</th></tr></thead><tbody>' + a.log.map(l => '<tr><td data-label="Time">' + fmtDT(l.timestamp) + '</td><td data-label="Job">' + esc(l.job) + '</td><td data-label="Result">' + badge(l.result, l.result === 'Error' ? 'bad' : 'ok') + '</td><td data-label="ms" class="num">' + esc(l.durationMs) + '</td><td data-label="Message">' + esc(l.message) + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty-sm">No runs logged yet.</div>') + '</div>';
}
CHG['job-toggle'] = async t => { try { const r = await api('settings.save', { values: { [t.dataset.k]: t.checked } }); S.boot.settings = r.settings; toast('Job setting saved', 'success'); } catch (e) { t.checked = !t.checked; toast(e.message, 'error'); } };
ACT['trg-install'] = async () => { try { const r = await api('admin.installTriggers'); toast(r.message, 'success'); renderAdmin(); } catch (e) { toast(e.message, 'error'); } };
ACT['trg-remove'] = async () => { try { const r = await api('admin.removeTriggers'); toast(r.message, 'success'); renderAdmin(); } catch (e) { toast(e.message, 'error'); } };
ACT['job-run'] = async t => { t.disabled = true; try { const r = await api('admin.runJob', { job: t.dataset.j }); toast(r.message, r.ok === false ? 'error' : 'success'); renderAdmin(); refreshBell(); } catch (e) { toast(e.message, 'error'); t.disabled = false; } };
async function admAudit(body) {
  const au = S.admin.audit, r = await api('admin.audit', { q: au.q, module: au.module, page: au.page }); au.page = r.page;
  body.innerHTML = '<div class="toolbar"><input class="inp grow" data-inp="au-q" type="search" value="' + esc(au.q) + '" placeholder="Search audit log…" aria-label="Search audit log"><select class="inp" data-chg="au-m" aria-label="Module">' + opts(['Sheets', 'Data', 'Tasks', 'Notes', 'Reminders', 'Settings', 'Backup'], au.module, 'All modules') + '</select></div><p class="muted-s">Showing the latest 1,500 audit entries. Deleted items keep a full copy under "Before".</p>' +
    (r.rows.length ? '<div class="card" style="padding:6px 14px">' + r.rows.map(x => '<details class="audit"><summary>' + badge(x.module) + ' <b>' + esc(x.action) + '</b><span class="muted-s">' + esc(x.recordId) + ' · ' + fmtDT(x.timestamp) + ' · ' + esc(x.user) + '</span></summary>' + (x.before ? '<div class="muted-s">Before</div><pre class="json">' + esc(x.before) + '</pre>' : '') + (x.after ? '<div class="muted-s">After</div><pre class="json">' + esc(x.after) + '</pre>' : '') + '</details>').join('') + '</div>' + pager('audit', r.page, r.pages, r.total, 'entries') : empty('No audit entries', 'Changes will be listed here.'));

INP['au-q'] = debounce(el => { S.admin.audit.q = el.value; S.admin.audit.page = 1; renderAdmin(); }, 400);
CHG['au-m'] = t => { S.admin.audit.module = t.value; S.admin.audit.page = 1; renderAdmin(); };
async function admBackups(body) {
  const r = await api('admin.backups');
  body.innerHTML = '<div class="page-h"><div><p>Backups are full copies of the database spreadsheet saved in your Google Drive folder "MasterSheet Backups". The newest ' + r.retention + ' are kept.</p></div><button class="btn primary" data-act="bk-create">' + ic('save') + ' Create backup now</button></div>' +
    (r.backups.length ? '<div class="tbl-wrap"><table class="rt cards"><thead><tr><th>Time</th><th>Type</th><th>Name</th><th>Status</th><th></th></tr></thead><tbody>' + r.backups.map(b => '<tr><td data-label="Time">' + fmtDT(b.timestamp) + '</td><td data-label="Type">' + esc(b.type) + '</td><td data-label="Name">' + (b.fileUrl ? '<a href="' + esc(b.fileUrl) + '" target="_blank" rel="noopener">' + esc(b.fileName) + '</a>' : esc(b.fileName)) + '</td><td data-label="Status">' + badge(b.status, b.status === 'OK' ? 'ok' : b.status === 'Failed' ? 'bad' : 'mut') + '</td><td class="acts">' + (b.status === 'OK' ? '<button class="btn sm" data-act="bk-restore" data-id="' + esc(b.id) + '" data-n="' + esc(b.fileName) + '">' + ic('rotate-ccw') + ' Restore</button> <button class="icon-btn sm" title="Delete backup" data-act="bk-del" data-id="' + esc(b.id) + '">' + ic('trash-2') + '</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>' : empty('No backups yet', 'Create your first backup.'));
}
ACT['bk-create'] = async t => { t.disabled = true; try { const b = await api('admin.backupCreate'); toast('Backup created: ' + b.fileName, 'success'); renderAdmin(); } catch (e) { toast(e.message, 'error'); t.disabled = false; } };
ACT['bk-del'] = async t => {
  if (!await confirmBox('Delete this backup?', 'The backup file is moved to your Drive trash.', { danger: true, ok: 'Delete' })) return;
  try { await api('admin.backupDelete', { id: t.dataset.id, confirm: true }); toast('Backup deleted', 'success'); renderAdmin(); } catch (e) { toast(e.message, 'error'); }
};
ACT['bk-restore'] = async t => {
  const word = await confirmBox('Restore from backup?', 'This REPLACES the current sheets, records, tasks, notes and reminders with the data from "' + t.dataset.n + '". A safety backup of the current state is created first. Logs and settings are kept.', { danger: true, ok: 'Restore', typed: 'RESTORE' });
  if (word !== 'RESTORE') return;
  toast('Restoring… please wait', 'info');
  try { const r = await api('admin.backupRestore', { id: t.dataset.id, confirm: 'RESTORE' }); toast(r.message, 'success'); renderAdmin(); refreshBell(); } catch (e) { toast(e.message, 'error'); }
};
function admSystem(body) {
  body.innerHTML = settingsForm('system') + '<div class="card" style="margin-top:14px"><h3>Owner &amp; security</h3><p class="muted-p">Access is limited to the owner account stored in Script Properties (OWNER_EMAIL). To transfer ownership, delete that property in the Apps Script editor and run setupMasterSheet() as the new owner.</p></div>';
}

/* ===================== polling & init ===================== */
function startPolling() {
  clearInterval(S.poll);
  const sec = Number(S.boot.settings.POLL_INTERVAL_SEC) || 0;
  if (sec <= 0) return;
  S.poll = setInterval(tick, Math.max(15, sec) * 1000);
}
async function tick() {
  if (document.hidden || $('.modal-back') || S.refreshing || ['admin', 'settings'].indexOf(S.page) >= 0) return;
  S.refreshing = true;
  try { await refreshBell(); await LOADERS[S.page](true); markOk(); } catch (e) { setSync('err'); } finally { S.refreshing = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.boot && Date.now() - S.lastOk > 20000) tick(); });
window.addEventListener('online', () => tick());
window.addEventListener('offline', () => setSync('err'));

async function init() {
  try { S.boot = await api('boot'); }
  catch (e) { $('#content').innerHTML = '<div class="alert warn"><div>' + esc(e.message) + '</div></div>'; icons(); return; }
  let theme = 'dark'; try { theme = localStorage.getItem('ms-theme') || S.boot.settings.DEFAULT_THEME || 'dark'; } catch (e) { /* ignore */ }
  applyTheme(theme); setCats(S.boot.categories); applySettings();
  $('#avatar').textContent = (S.boot.user || 'M').charAt(0).toUpperCase(); $('#avatar').title = S.boot.user;
  $('#gsearch').setAttribute('data-inp', 'gsearch');
  refreshBell();
  let last = 'dashboard'; try { last = localStorage.getItem('ms-page') || 'dashboard'; } catch (e) { /* ignore */ }
  if (!LOADERS[last]) last = 'dashboard';
  go(last); icons();
}
init();
})();
</script>
